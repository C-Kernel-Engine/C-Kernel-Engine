<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="sk-title sk-desc">
  <title id="sk-title">Supporting kernels: position embeddings, GELU erf, head-major attention</title>
  <desc id="sk-desc">Three shared kernels the Whisper path relies on after the frontend: position_embeddings_add applies the learned 1D table after the transpose, gelu_pytorch_erf_f32_inplace is the exact erf GELU matching the PyTorch oracle, and attention_forward_query_key_head_major_f32 serves both the self-attention decode step and the Q=1, K=1500 cross-attention oracle.</desc>
  <defs>
    <linearGradient id="sk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0f1b2d"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="sk-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13233c"/>
      <stop offset="1" stop-color="#0d1a2e"/>
    </linearGradient>
    <filter id="sk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1100" height="440" fill="url(#sk-bg)"/>
  <g opacity="0.25" stroke="#26364f" stroke-width="1">
    <path d="M0 110H1100M0 220H1100M0 330H1100"/>
    <path d="M100 0V440M300 0V440M500 0V440M700 0V440M900 0V440"/>
  </g>

  <text x="40" y="42" font-size="12" letter-spacing="3" fill="#7dd3fc" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">SHARED KERNELS &#183; NOT WHISPER-SPECIFIC, STILL ON THE CRITICAL PATH</text>
  <text x="40" y="80" font-size="28" font-weight="700" fill="#f1f5f9" font-family="'Inter',system-ui,sans-serif">The Glue After the Frontend</text>
  <text x="40" y="106" font-size="13.5" fill="#94a3b8" font-family="'Inter',system-ui,sans-serif">Three library kernels the audio encoder and decoder lean on &#8212; the same contracts the text and vision lanes already pin.</text>

  <!-- Card 1: position embeddings -->
  <g filter="url(#sk-shadow)">
    <rect x="40" y="140" width="330" height="262" rx="12" fill="url(#sk-node)" stroke="#2b3f5f"/>
    <rect x="40" y="140" width="330" height="34" rx="12" fill="#0ea5e9" opacity="0.16"/>
    <text x="56" y="162" font-size="11.5" letter-spacing="1.5" fill="#7dd3fc" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">POSITION EMBEDDINGS</text>
    <text x="56" y="196" font-size="11" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">position_embeddings_add</text>

    <!-- token rows + pos rows -->
    <g font-family="ui-monospace,Menlo,monospace" font-size="10">
      <rect x="60" y="214" width="42" height="16" rx="3" fill="#0ea5e9" opacity="0.55"/>
      <rect x="104" y="214" width="42" height="16" rx="3" fill="#0ea5e9" opacity="0.4"/>
      <rect x="148" y="214" width="42" height="16" rx="3" fill="#0ea5e9" opacity="0.3"/>
      <text x="200" y="226" fill="#94a3b8">x&#160;&#160;[1500 &#215; 384]</text>
      <rect x="60" y="238" width="42" height="16" rx="3" fill="#fbbf24" opacity="0.55"/>
      <rect x="104" y="238" width="42" height="16" rx="3" fill="#fbbf24" opacity="0.4"/>
      <rect x="148" y="238" width="42" height="16" rx="3" fill="#fbbf24" opacity="0.3"/>
      <text x="200" y="250" fill="#94a3b8">pos [1500 &#215; 384]</text>
    </g>
    <text x="56" y="288" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">x[t] += pos[t] &#8212; row-wise add after the</text>
    <text x="56" y="306" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">transpose, learned 1D table along time</text>
    <line x1="56" y1="322" x2="354" y2="322" stroke="#1e293b" stroke-width="1"/>
    <text x="56" y="344" font-size="11.5" fill="#64748b" font-family="'Inter',system-ui,sans-serif">limit = min(tokens, positions) &#8212; same</text>
    <text x="56" y="362" font-size="11.5" fill="#64748b" font-family="'Inter',system-ui,sans-serif">kernel vision uses; audio is just 1D</text>
    <text x="56" y="388" font-size="10.5" fill="#34d399" font-family="ui-monospace,Menlo,monospace">src/kernels/vision_kernels.c</text>
  </g>

  <!-- Card 2: GELU erf -->
  <g filter="url(#sk-shadow)">
    <rect x="385" y="140" width="330" height="262" rx="12" fill="url(#sk-node)" stroke="#2b3f5f"/>
    <rect x="385" y="140" width="330" height="34" rx="12" fill="#f59e0b" opacity="0.14"/>
    <text x="401" y="162" font-size="11.5" letter-spacing="1.5" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">GELU &#183; EXACT ERF FORM</text>
    <text x="401" y="196" font-size="11" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">gelu_pytorch_erf_f32_inplace</text>

    <!-- gelu curve -->
    <path d="M 405 258 C 430 258 440 256 455 240 C 470 224 480 218 510 216 L 670 214" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <line x1="405" y1="258" x2="670" y2="258" stroke="#334155" stroke-width="1"/>
    <line x1="455" y1="200" x2="455" y2="270" stroke="#334155" stroke-width="1"/>
    <text x="640" y="252" font-size="10" fill="#64748b" font-family="ui-monospace,Menlo,monospace">x</text>

    <text x="401" y="298" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">0.5&#183;x&#183;(1 + erf(x/&#8730;2)) &#8212; erff per element,</text>
    <text x="401" y="316" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">in-place, matches approximate='none'</text>
    <line x1="401" y1="332" x2="699" y2="332" stroke="#1e293b" stroke-width="1"/>
    <text x="401" y="354" font-size="11.5" fill="#64748b" font-family="'Inter',system-ui,sans-serif">not gelu_exact_inplace &#8212; that one's</text>
    <text x="401" y="372" font-size="11.5" fill="#64748b" font-family="'Inter',system-ui,sans-serif">historical contract is the tanh approx</text>
    <text x="401" y="398" font-size="10.5" fill="#34d399" font-family="ui-monospace,Menlo,monospace">src/kernels/gelu_kernels.c</text>
  </g>

  <!-- Card 3: head-major attention -->
  <g filter="url(#sk-shadow)">
    <rect x="730" y="140" width="330" height="262" rx="12" fill="url(#sk-node)" stroke="#2b3f5f"/>
    <rect x="730" y="140" width="330" height="34" rx="12" fill="#10b981" opacity="0.14"/>
    <text x="746" y="162" font-size="11.5" letter-spacing="1.5" fill="#34d399" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">HEAD-MAJOR ATTENTION</text>
    <text x="746" y="196" font-size="10.5" fill="#fbbf24" font-family="ui-monospace,'JetBrains Mono',Menlo,monospace">attention_forward_query_key_head_major_f32</text>

    <!-- Q row x K block -->
    <rect x="750" y="212" width="120" height="18" rx="3" fill="#10b981" opacity="0.5"/>
    <text x="756" y="225" font-size="10" fill="#d1fae5" font-family="ui-monospace,Menlo,monospace">Q [1 &#215; 384]</text>
    <rect x="890" y="206" width="150" height="56" rx="4" fill="#0ea5e9" opacity="0.3"/>
    <text x="900" y="230" font-size="10" fill="#bae6fd" font-family="ui-monospace,Menlo,monospace">K&#7511; [384 &#215; 1500]</text>
    <text x="900" y="248" font-size="10" fill="#bae6fd" font-family="ui-monospace,Menlo,monospace">cached, head-major</text>

    <text x="746" y="296" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">one kernel serves both oracles:</text>
    <text x="746" y="314" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">self-attn decode (pos+1 rows) and</text>
    <text x="746" y="332" font-size="12.5" fill="#cbd5e1" font-family="'Inter',system-ui,sans-serif">cross-attn (Q=1, K=1500)</text>
    <line x1="746" y1="346" x2="1044" y2="346" stroke="#1e293b" stroke-width="1"/>
    <text x="746" y="368" font-size="11.5" fill="#64748b" font-family="'Inter',system-ui,sans-serif">head-major layout keeps per-head rows</text>
    <text x="746" y="386" font-size="11.5" fill="#64748b" font-family="'Inter',system-ui,sans-serif">contiguous for the cached slices</text>
    <text x="746" y="410" font-size="10.5" fill="#34d399" font-family="ui-monospace,Menlo,monospace">include/ckernel_engine.h &#183; attention family</text>
  </g>
</svg>
