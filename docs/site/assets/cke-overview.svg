<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">C-Kernel-Engine at a glance</title>
  <desc id="desc">CKE compiles GGUF and SafeTensors models into readable generated C runtimes for CPUs, across text, vision, and audio model families, with measured numerical evidence and X-Ray introspection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08100f"/><stop offset=".52" stop-color="#101a18"/><stop offset="1" stop-color="#092335"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fb9b2" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#47b475"/><stop offset=".5" stop-color="#ffb400"/><stop offset="1" stop-color="#07adf8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="900" fill="url(#bg)"/>
  <rect width="1280" height="900" fill="url(#grid)"/>
  <circle cx="1160" cy="80" r="240" fill="#07adf8" opacity=".06"/>
  <circle cx="60" cy="860" r="260" fill="#47b475" opacity=".07"/>

  <!-- Header -->
  <g transform="translate(60 42)">
    <rect width="70" height="70" rx="12" fill="#ffb400"/>
    <text x="35" y="48" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="800" fill="#101614">CK</text>
    <text x="92" y="31" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#ffb400" letter-spacing="3">C-KERNEL-ENGINE</text>
    <text x="92" y="58" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#9fb9b2">One compiler. Readable C runtimes. Measured CPU inference.</text>
  </g>

  <!-- Pipeline -->
  <g font-family="DejaVu Sans, sans-serif">
    <g transform="translate(60 152)">
      <rect width="262" height="92" rx="12" fill="#172522" stroke="#47b475" stroke-opacity=".7"/>
      <text x="131" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#47b475">MODEL ARTIFACT</text>
      <text x="131" y="58" text-anchor="middle" font-size="13.5" fill="#9fb9b2">GGUF · SafeTensors</text>
      <text x="131" y="76" text-anchor="middle" font-size="12.5" fill="#6f8f87">public hf:// or local file</text>
    </g>
    <path d="M330 198h38" stroke="url(#flow)" stroke-width="4"/>
    <path d="m364 190 12 8-12 8" fill="none" stroke="#5bc3a0" stroke-width="4"/>
    <g transform="translate(380 152)">
      <rect width="262" height="92" rx="12" fill="#172522" stroke="#ffb400" stroke-opacity=".75"/>
      <text x="131" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#ffb400">CKE COMPILER</text>
      <text x="131" y="58" text-anchor="middle" font-size="13.5" fill="#9fb9b2">circuits · kernel maps</text>
      <text x="131" y="76" text-anchor="middle" font-size="12.5" fill="#6f8f87">hardened provider selection</text>
    </g>
    <path d="M650 198h38" stroke="url(#flow)" stroke-width="4"/>
    <path d="m684 190 12 8-12 8" fill="none" stroke="#32b6c3" stroke-width="4"/>
    <g transform="translate(700 152)">
      <rect width="262" height="92" rx="12" fill="#172522" stroke="#07adf8" stroke-opacity=".75"/>
      <text x="131" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#07adf8">GENERATED C RUNTIME</text>
      <text x="131" y="58" text-anchor="middle" font-size="13.5" fill="#9fb9b2">model.c → libmodel.so</text>
      <text x="131" y="76" text-anchor="middle" font-size="12.5" fill="#6f8f87">no Python in the loop</text>
    </g>
    <path d="M970 198h38" stroke="url(#flow)" stroke-width="4"/>
    <path d="m1004 190 12 8-12 8" fill="none" stroke="#07adf8" stroke-width="4"/>
    <g transform="translate(1020 152)">
      <rect width="200" height="92" rx="12" fill="#172522" stroke="#b48bff" stroke-opacity=".7"/>
      <text x="100" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#b48bff">X-RAY</text>
      <text x="100" y="58" text-anchor="middle" font-size="13.5" fill="#9fb9b2">provider · numerics</text>
      <text x="100" y="76" text-anchor="middle" font-size="12.5" fill="#6f8f87">per-op timing</text>
    </g>
  </g>

  <!-- Left panel: model lanes -->
  <text x="60" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#9fb9b2" letter-spacing="2">RUNS TODAY — THREE LANES</text>
  <rect x="60" y="322" width="580" height="316" rx="14" fill="#101a18" stroke="#9fb9b2" stroke-opacity=".16"/>
  <g font-family="DejaVu Sans, sans-serif">
    <!-- Text lane -->
    <rect x="84" y="346" width="86" height="28" rx="14" fill="#47b475" opacity=".16"/>
    <text x="127" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#47b475">TEXT</text>
    <text x="186" y="365" font-size="14.5" fill="#f4f7f6">Gemma 3 / 4 · Qwen 2 / 3 / 3.5 / 3.6 / 3.8 · GLM-4</text>
    <text x="186" y="388" font-size="14.5" fill="#f4f7f6">Nemotron · Kimi · Cohere2 · Laguna · Instella-MoE</text>
    <text x="186" y="411" font-size="14.5" fill="#f4f7f6">Nanbeige · GPT-2</text>
    <text x="186" y="434" font-size="12.5" fill="#6f8f87">quantized GGUF decode · quantized prefill · KV-cache · MoE · DeltaNet</text>
    <line x1="84" y1="456" x2="616" y2="456" stroke="#9fb9b2" stroke-opacity=".12"/>
    <!-- Vision lane -->
    <rect x="84" y="474" width="86" height="28" rx="14" fill="#07adf8" opacity=".16"/>
    <text x="127" y="493" text-anchor="middle" font-size="13" font-weight="700" fill="#07adf8">VISION</text>
    <text x="186" y="493" font-size="14.5" fill="#f4f7f6">Qwen3-VL · Qwen3.6-VL · Gemma4 bridge</text>
    <text x="186" y="516" font-size="14.5" fill="#c9d6d2">generated encoder + bridge, M-RoPE, OCR lanes</text>
    <text x="186" y="539" font-size="12.5" fill="#6f8f87">parity-gated against llama.cpp mmproj and PyTorch</text>
    <line x1="84" y1="561" x2="616" y2="561" stroke="#9fb9b2" stroke-opacity=".12"/>
    <!-- Audio lane -->
    <rect x="84" y="579" width="86" height="28" rx="14" fill="#b48bff" opacity=".16"/>
    <text x="127" y="598" text-anchor="middle" font-size="13" font-weight="700" fill="#b48bff">AUDIO</text>
    <text x="186" y="598" font-size="14.5" fill="#f4f7f6">Whisper Tiny · Base · Small</text>
    <text x="186" y="621" font-size="14.5" fill="#c9d6d2">generated FP32 frontend + encoder + decoder</text>
  </g>

  <!-- Right panel: evidence -->
  <text x="700" y="306" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#9fb9b2" letter-spacing="2">EVIDENCE, NOT CLAIMS</text>
  <rect x="700" y="322" width="520" height="316" rx="14" fill="#101a18" stroke="#9fb9b2" stroke-opacity=".16"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="732" y="380" font-size="30" font-weight="800" fill="#ffb400">4,096 / 4,096</text>
    <text x="732" y="406" font-size="13.5" fill="#c9d6d2">full-vocabulary rows bit-exact vs llama.cpp — Qwen3.8 27B</text>
    <line x1="732" y1="428" x2="1188" y2="428" stroke="#9fb9b2" stroke-opacity=".12"/>
    <text x="732" y="472" font-size="30" font-weight="800" fill="#47b475">131 K tokens</text>
    <text x="732" y="498" font-size="13.5" fill="#c9d6d2">executed end-to-end on one CPU node · 262 K planner boundary</text>
    <line x1="732" y1="520" x2="1188" y2="520" stroke="#9fb9b2" stroke-opacity=".12"/>
    <text x="732" y="564" font-size="30" font-weight="800" fill="#07adf8">token-exact</text>
    <text x="732" y="590" font-size="13.5" fill="#c9d6d2">Whisper vs Hugging Face on public JFK fixtures</text>
    <line x1="732" y1="606" x2="1188" y2="606" stroke="#9fb9b2" stroke-opacity=".12"/>
    <text x="732" y="638" font-size="13.5" fill="#9fb9b2">Nightly CI (Aug 2026): <tspan fill="#47b475" font-weight="700">92 green / 0 failed</tspan> — text · vision · audio, skips disclosed</text>
  </g>

  <!-- Hardware band -->
  <rect x="60" y="676" width="1160" height="128" rx="14" fill="#101a18" stroke="#9fb9b2" stroke-opacity=".16"/>
  <text x="92" y="712" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#9fb9b2" letter-spacing="2">ONE SOURCE, EVERY CPU</text>
  <g font-family="DejaVu Sans, sans-serif" font-size="14">
    <g>
      <rect x="92" y="732" width="104" height="34" rx="17" fill="#172522" stroke="#47b475" stroke-opacity=".55"/>
      <text x="144" y="754" text-anchor="middle" fill="#f4f7f6">AVX2 · FMA</text>
      <rect x="208" y="732" width="110" height="34" rx="17" fill="#172522" stroke="#47b475" stroke-opacity=".55"/>
      <text x="263" y="754" text-anchor="middle" fill="#f4f7f6">AVX-VNNI</text>
      <rect x="330" y="732" width="96" height="34" rx="17" fill="#172522" stroke="#47b475" stroke-opacity=".55"/>
      <text x="378" y="754" text-anchor="middle" fill="#f4f7f6">AVX-512</text>
      <rect x="438" y="732" width="118" height="34" rx="17" fill="#172522" stroke="#47b475" stroke-opacity=".55"/>
      <text x="497" y="754" text-anchor="middle" fill="#f4f7f6">ARM NEON</text>
    </g>
    <g>
      <rect x="588" y="732" width="150" height="34" rx="17" fill="#172522" stroke="#ffb400" stroke-opacity=".6" stroke-dasharray="5 4"/>
      <text x="663" y="754" text-anchor="middle" fill="#ffb400">AMX BF16 · planned</text>
      <rect x="750" y="732" width="250" height="34" rx="17" fill="#172522" stroke="#ffb400" stroke-opacity=".6" stroke-dasharray="5 4"/>
      <text x="875" y="754" text-anchor="middle" fill="#ffb400">distributed CPU zip-fusion · research</text>
    </g>
    <text x="92" y="788" font-size="12.5" fill="#6f8f87">provider picked from detected ISA at build time — same numerical contract on every target</text>
    <text x="1188" y="788" text-anchor="end" font-size="12.5" fill="#6f8f87">dashed = no results claimed yet</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="836" x2="1220" y2="836" stroke="#9fb9b2" stroke-opacity=".18"/>
  <text x="60" y="872" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" fill="#47b475">Correctness before optimization.</text>
  <text x="1220" y="872" text-anchor="end" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#9fb9b2">github.com/C-Kernel-Engine</text>
</svg>
