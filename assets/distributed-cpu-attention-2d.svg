<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660">
  <title>Two-dimensional attention: six nodes as three context shards times two head groups, merged by online-softmax statistics</title>
  <desc>A grid of six CPU nodes: two head-group columns and three context-shard rows. Each node owns one half of the attention heads and one third of a one-million-token context, and computes local attention tiles independently. Across each head-group column the context partitions merge with online-softmax sufficient statistics: local max, local normalization sum, and local weighted output. A struck-through panel contrasts this with moving the full one-million by one-million attention matrix across the fabric.</desc>

  <defs>
    <marker id="arr2d" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#808080"/>
    </marker>
  </defs>

  <rect width="960" height="660" fill="#232323"/>

  <text x="480" y="34" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#ffb400" text-anchor="middle">2-D Attention: Head Groups × Context Shards</text>
  <text x="480" y="56" font-family="Inter, sans-serif" font-size="12" fill="#808080" text-anchor="middle">6 nodes = 2 head groups × 3 context shards — merge statistics, never matrices</text>

  <!-- axis labels -->
  <text x="330" y="92" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#a0a0a0" text-anchor="middle">HEADS →</text>
  <text x="60" y="300" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#a0a0a0" text-anchor="middle" transform="rotate(-90 60 300)">CONTEXT →</text>

  <!-- column headers -->
  <text x="215" y="116" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">head group A</text>
  <text x="445" y="116" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle">head group B</text>

  <!-- grid cells: 2 cols x 3 rows -->
  <g font-family="Inter, sans-serif">
    <rect x="120" y="128" width="190" height="100" rx="8" fill="#0c1d2a" stroke="#07adf8" stroke-width="1.5"/>
    <text x="215" y="158" font-size="13" font-weight="700" fill="#b0d9ef" text-anchor="middle">node 0</text>
    <text x="215" y="178" font-size="11" fill="#5a8fb0" text-anchor="middle">ctx shard 0 · heads A</text>
    <text x="215" y="196" font-size="11" fill="#5a8fb0" text-anchor="middle">local attention tiles</text>

    <rect x="350" y="128" width="190" height="100" rx="8" fill="#0c1d2a" stroke="#07adf8" stroke-width="1.5"/>
    <text x="445" y="158" font-size="13" font-weight="700" fill="#b0d9ef" text-anchor="middle">node 1</text>
    <text x="445" y="178" font-size="11" fill="#5a8fb0" text-anchor="middle">ctx shard 0 · heads B</text>
    <text x="445" y="196" font-size="11" fill="#5a8fb0" text-anchor="middle">local attention tiles</text>

    <rect x="120" y="248" width="190" height="100" rx="8" fill="#0c1d2a" stroke="#07adf8" stroke-width="1.5"/>
    <text x="215" y="278" font-size="13" font-weight="700" fill="#b0d9ef" text-anchor="middle">node 2</text>
    <text x="215" y="298" font-size="11" fill="#5a8fb0" text-anchor="middle">ctx shard 1 · heads A</text>
    <text x="215" y="316" font-size="11" fill="#5a8fb0" text-anchor="middle">local attention tiles</text>

    <rect x="350" y="248" width="190" height="100" rx="8" fill="#0c1d2a" stroke="#07adf8" stroke-width="1.5"/>
    <text x="445" y="278" font-size="13" font-weight="700" fill="#b0d9ef" text-anchor="middle">node 3</text>
    <text x="445" y="298" font-size="11" fill="#5a8fb0" text-anchor="middle">ctx shard 1 · heads B</text>
    <text x="445" y="316" font-size="11" fill="#5a8fb0" text-anchor="middle">local attention tiles</text>

    <rect x="120" y="368" width="190" height="100" rx="8" fill="#0c1d2a" stroke="#07adf8" stroke-width="1.5"/>
    <text x="215" y="398" font-size="13" font-weight="700" fill="#b0d9ef" text-anchor="middle">node 4</text>
    <text x="215" y="418" font-size="11" fill="#5a8fb0" text-anchor="middle">ctx shard 2 · heads A</text>
    <text x="215" y="436" font-size="11" fill="#5a8fb0" text-anchor="middle">local attention tiles</text>

    <rect x="350" y="368" width="190" height="100" rx="8" fill="#0c1d2a" stroke="#07adf8" stroke-width="1.5"/>
    <text x="445" y="398" font-size="13" font-weight="700" fill="#b0d9ef" text-anchor="middle">node 5</text>
    <text x="445" y="418" font-size="11" fill="#5a8fb0" text-anchor="middle">ctx shard 2 · heads B</text>
    <text x="445" y="436" font-size="11" fill="#5a8fb0" text-anchor="middle">local attention tiles</text>
  </g>

  <!-- merge arrows: down each column -->
  <line x1="310" y1="178" x2="350" y2="178" stroke="#404040" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="215" y1="228" x2="215" y2="246" stroke="#47b475" stroke-width="1.5" marker-end="url(#arr2d)"/>
  <line x1="215" y1="348" x2="215" y2="366" stroke="#47b475" stroke-width="1.5" marker-end="url(#arr2d)"/>
  <line x1="445" y1="228" x2="445" y2="246" stroke="#47b475" stroke-width="1.5" marker-end="url(#arr2d)"/>
  <line x1="445" y1="348" x2="445" y2="366" stroke="#47b475" stroke-width="1.5" marker-end="url(#arr2d)"/>

  <!-- merge box -->
  <line x1="215" y1="468" x2="290" y2="512" stroke="#47b475" stroke-width="1.5" marker-end="url(#arr2d)"/>
  <line x1="445" y1="468" x2="390" y2="512" stroke="#47b475" stroke-width="1.5" marker-end="url(#arr2d)"/>
  <rect x="120" y="514" width="420" height="72" rx="8" fill="#0c1f14" stroke="#47b475" stroke-width="2"/>
  <text x="330" y="540" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#86efac" text-anchor="middle">online-softmax merge per head group</text>
  <text x="330" y="560" font-family="Inter, sans-serif" font-size="11.5" fill="#5a9e78" text-anchor="middle">local max m_i · local norm sum l_i · local weighted output o_i</text>
  <text x="330" y="577" font-family="Inter, sans-serif" font-size="10.5" fill="#5a9e78" text-anchor="middle">a few vectors per query block — not the score matrix</text>

  <!-- contrast panel: what is NOT moved -->
  <rect x="600" y="128" width="300" height="300" rx="8" fill="#331414" stroke="#f85149" stroke-width="1.5"/>
  <text x="750" y="156" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">What never crosses the fabric</text>
  <rect x="640" y="176" width="220" height="150" rx="4" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="750" y="246" font-family="Inter, sans-serif" font-size="12.5" fill="#f87171" text-anchor="middle">1M × 1M</text>
  <text x="750" y="266" font-family="Inter, sans-serif" font-size="12.5" fill="#f87171" text-anchor="middle">attention matrix</text>
  <line x1="650" y1="316" x2="850" y2="186" stroke="#f85149" stroke-width="3"/>
  <text x="750" y="356" font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0" text-anchor="middle">the network sees statistics,</text>
  <text x="750" y="374" font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0" text-anchor="middle">not quadratic-score payloads</text>
  <text x="750" y="404" font-family="Inter, sans-serif" font-size="11.5" fill="#808080" text-anchor="middle">GQA: partition Q-head groups so</text>
  <text x="750" y="420" font-family="Inter, sans-serif" font-size="11.5" fill="#808080" text-anchor="middle">needed KV heads are local or replicated</text>

  <!-- head-exhaustion note -->
  <rect x="600" y="448" width="300" height="138" rx="8" fill="#262626" stroke="#404040"/>
  <text x="750" y="474" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#a0a0a0" text-anchor="middle">Why 2-D at all?</text>
  <text x="750" y="498" font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0" text-anchor="middle">32 heads exhaust head-parallelism</text>
  <text x="750" y="516" font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0" text-anchor="middle">at 32 nodes (1 head each).</text>
  <text x="750" y="540" font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0" text-anchor="middle">At 128K–1M context the sequence</text>
  <text x="750" y="558" font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0" text-anchor="middle">is the next parallel axis.</text>

  <text x="330" y="624" font-family="Inter, sans-serif" font-size="12" fill="#808080" text-anchor="middle">Each node: 1/3 of context × 1/2 of heads — large local tiles, tiny merge state</text>
</svg>
