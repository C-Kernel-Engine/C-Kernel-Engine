<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
  <title>The batch continuum: CKU versus runnable token rows, rising from the bandwidth regime through a transition to the compute plateau, with a second node's plateau sketched as a hypothesis</title>
  <desc>A schematic plot with runnable token rows B on a logarithmic horizontal axis (1, 2, 4, 8, 16, 32, 64, 128) and useful throughput on the vertical axis. A single-node curve rises slowly through the bandwidth regime at B equals 1 to 4, steepens through a transition around B equals 16 to 32, and flattens into a compute-dominated plateau near B equals 64 to 128. A dashed second curve above it sketches the two-node plateau as the sum of individual peaks minus synchronization overhead, labeled hypothesis. The saturation point where the single-node curve flattens tells CKE how much batching a node needs before its compute is genuinely exercised. This is a schematic MODEL shape to be measured, not data — the first Ryzen experiment sweeps B and replaces this figure with measurements.</desc>

  <defs>
    <marker id="arrCont" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#808080"/>
    </marker>
  </defs>

  <rect width="960" height="640" fill="#232323"/>

  <text x="480" y="34" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#ffb400" text-anchor="middle">The Batch Continuum: CKU vs Runnable Token Rows</text>
  <text x="480" y="56" font-family="Inter, sans-serif" font-size="12" fill="#808080" text-anchor="middle">GEMV-like → small GEMM → large GEMM as B grows — schematic MODEL shape to be measured, not data</text>

  <!-- axes -->
  <line x1="110" y1="520" x2="890" y2="520" stroke="#808080" stroke-width="1.5" marker-end="url(#arrCont)"/>
  <line x1="110" y1="520" x2="110" y2="110" stroke="#808080" stroke-width="1.5" marker-end="url(#arrCont)"/>
  <text x="500" y="552" font-family="Inter, sans-serif" font-size="12" fill="#a0a0a0" text-anchor="middle">runnable token rows B (log scale)</text>
  <text x="86" y="320" font-family="Inter, sans-serif" font-size="12" fill="#a0a0a0" text-anchor="middle" transform="rotate(-90 86 320)">useful throughput (CKU · GFLOP/s · GB/s)</text>

  <!-- x ticks -->
  <g font-family="Inter, sans-serif" font-size="11" fill="#808080" text-anchor="middle">
    <text x="150" y="538">1</text>
    <text x="245" y="538">2</text>
    <text x="340" y="538">4</text>
    <text x="435" y="538">8</text>
    <text x="530" y="538">16</text>
    <text x="625" y="538">32</text>
    <text x="720" y="538">64</text>
    <text x="815" y="538">128</text>
  </g>

  <!-- regime bands -->
  <rect x="110" y="110" width="325" height="410" fill="#331414" opacity="0.35"/>
  <rect x="435" y="110" width="190" height="410" fill="#2a2410" opacity="0.35"/>
  <rect x="625" y="110" width="265" height="410" fill="#0c1f14" opacity="0.35"/>
  <text x="272" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">bandwidth regime</text>
  <text x="272" y="156" font-family="Inter, sans-serif" font-size="10" fill="#f8a5a5" text-anchor="middle">GEMV-like · every weight byte read once</text>
  <text x="530" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffd97a" text-anchor="middle">transition</text>
  <text x="530" y="156" font-family="Inter, sans-serif" font-size="10" fill="#c8a04a" text-anchor="middle">reuse begins to pay</text>
  <text x="757" y="138" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#86efac" text-anchor="middle">compute plateau</text>
  <text x="757" y="156" font-family="Inter, sans-serif" font-size="10" fill="#5a9e78" text-anchor="middle">dense-GEMM regime</text>

  <!-- single-node curve: bandwidth-flat then rising then plateau -->
  <path d="M 150 480 C 260 468, 340 452, 435 430 C 530 405, 590 330, 660 260 C 700 220, 760 205, 850 200"
        fill="none" stroke="#07adf8" stroke-width="3"/>
  <text x="600" y="356" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#7dd3fc" text-anchor="middle" transform="rotate(-38 600 356)">one node</text>

  <!-- two-node dashed curve -->
  <path d="M 150 470 C 260 455, 340 436, 435 408 C 530 375, 590 288, 660 214 C 700 172, 760 156, 850 150"
        fill="none" stroke="#47b475" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="770" y="104" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#86efac" text-anchor="middle">two nodes ≈ P₁+P₂ − sync</text>
  <text x="770" y="88" font-family="Inter, sans-serif" font-size="10" fill="#5a9e78" text-anchor="middle">(HYPOTHESIS)</text>

  <!-- saturation point -->
  <circle cx="700" cy="205" r="5" fill="#ffb400"/>
  <line x1="700" y1="205" x2="700" y2="520" stroke="#ffb400" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="618" y="186" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#ffd97a" text-anchor="middle">saturation point:</text>
  <text x="618" y="172" font-family="Inter, sans-serif" font-size="10" fill="#c8a04a" text-anchor="middle">enough rows to feed the cores</text>

  <!-- footer -->
  <rect x="110" y="566" width="780" height="56" rx="8" fill="#262626" stroke="#404040"/>
  <text x="130" y="590" font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0">The first Ryzen experiment sweeps B = 1, 2, 4, … 128 and measures effective GFLOP/s, GB/s and CKU —</text>
  <text x="130" y="608" font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0">replacing this schematic with the real transition point; then repeats distributed on two nodes.</text>
</svg>
