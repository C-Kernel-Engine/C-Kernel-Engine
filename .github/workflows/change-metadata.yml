name: Change Metadata

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Validate PR and commit handoffs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/validate_change_metadata.py pr --body-file "$RUNNER_TEMP/pr-body.md"
          python3 scripts/validate_change_metadata.py commits --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Test metadata validator
        run: python3 -m unittest tests.test_change_metadata

      - name: Check root layout allowlist
        run: python3 scripts/check_root_layout.py

      - name: Check v8 training capability ledger freshness
        run: python3 version/v8/scripts/build_training_capability_ledger_v8.py --check

      - name: Reject new OpenMP dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m unittest discover -s tests -p test_openmp_policy.py
          python3 scripts/check_openmp_policy.py "$BASE_SHA" "$HEAD_SHA"

  dsl-ad-hoc:
    name: DSL ad hoc code check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit compiler policy and publish change counts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m unittest discover -s tests -p test_bringup_footprint.py
          python3 scripts/report_bringup_footprint.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 version/v8/scripts/audit_dsl_policy_v8.py
