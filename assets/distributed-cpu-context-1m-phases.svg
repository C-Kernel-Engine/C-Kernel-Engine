<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
  <title>One-million-token context: decode and prefill pay radically different communication over the same heads-times-context grid</title>
  <desc>Two panels over the same head-groups-times-context-shards grid. Decode: one new query, Q is 1 by d, against K and V of L by d; each context shard returns the online-softmax sufficient statistics for that single query per head — local max, local normalizer, local weighted output — a tiny payload of bytes per head per shard. Prefill: many simultaneous queries, Q is T by d; the sufficient statistics themselves now carry the query dimension, so the merge payload scales with T and must be tiled or streamed — the communication budget is not the tiny one-query payload. Both merges are exact online softmax; only the payload shape differs. All labels are THEORETICAL model statements, not measurements.</desc>

  <defs>
    <marker id="arrCtxP" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#808080"/>
    </marker>
    <pattern id="ctxpStripe" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#0c1d2a"/>
      <rect x="0" y="0" width="3" height="9" fill="#123549"/>
    </pattern>
  </defs>

  <rect width="960" height="560" fill="#232323"/>

  <text x="480" y="34" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#ffb400" text-anchor="middle">1M Context: Same Grid, Two Very Different Payloads</text>
  <text x="480" y="56" font-family="Inter, sans-serif" font-size="12" fill="#808080" text-anchor="middle">Decode and prefill share the heads × context decomposition — but the merge payload scales with the query count</text>

  <!-- ═══ DECODE panel ═══ -->
  <rect x="48" y="80" width="420" height="380" rx="10" fill="#262626" stroke="#404040"/>
  <text x="258" y="112" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#7dd3fc" text-anchor="middle">DECODE at 1M — one new query</text>

  <!-- Q 1xd vs K,V Lxd -->
  <rect x="92" y="140" width="26" height="90" rx="4" fill="#2a2410" stroke="#ffb400" stroke-width="1.5"/>
  <text x="105" y="252" font-family="Inter, sans-serif" font-size="11" fill="#ffd97a" text-anchor="middle">Q: 1×d</text>
  <text x="140" y="190" font-family="Inter, sans-serif" font-size="14" fill="#808080">vs</text>
  <rect x="168" y="140" width="180" height="90" rx="4" fill="url(#ctxpStripe)" stroke="#07adf8" stroke-width="1.5"/>
  <text x="258" y="180" font-family="Inter, sans-serif" font-size="11.5" fill="#b0d9ef" text-anchor="middle">K, V: L×d</text>
  <text x="258" y="198" font-family="Inter, sans-serif" font-size="10" fill="#5a8fb0" text-anchor="middle">sharded by context</text>
  <text x="258" y="252" font-family="Inter, sans-serif" font-size="11" fill="#808080" text-anchor="middle">KV never leaves its shard</text>

  <g font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0">
    <text x="78" y="312">each context shard returns stats for</text>
    <text x="78" y="332">one query per head: (m_i, l_i, o_i)</text>
  </g>

  <rect x="72" y="356" width="372" height="80" rx="8" fill="#0c1f14" stroke="#47b475" stroke-width="2"/>
  <text x="258" y="384" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#86efac" text-anchor="middle">payload: bytes-to-KB per head per shard</text>
  <text x="258" y="406" font-family="Inter, sans-serif" font-size="10.5" fill="#5a9e78" text-anchor="middle">scalar max, scalar normalizer, one d_head vector</text>
  <text x="258" y="424" font-family="Inter, sans-serif" font-size="10.5" fill="#5a9e78" text-anchor="middle">— independent of L</text>

  <!-- ═══ PREFILL panel ═══ -->
  <rect x="492" y="80" width="420" height="380" rx="10" fill="#262626" stroke="#404040"/>
  <text x="702" y="112" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#7dd3fc" text-anchor="middle">PREFILL at 1M — T simultaneous queries</text>

  <!-- Q Txd vs K,V Lxd -->
  <rect x="536" y="140" width="60" height="90" rx="4" fill="#2a2410" stroke="#ffb400" stroke-width="1.5"/>
  <text x="566" y="252" font-family="Inter, sans-serif" font-size="11" fill="#ffd97a" text-anchor="middle">Q: T×d</text>
  <text x="618" y="190" font-family="Inter, sans-serif" font-size="14" fill="#808080">vs</text>
  <rect x="646" y="140" width="180" height="90" rx="4" fill="url(#ctxpStripe)" stroke="#07adf8" stroke-width="1.5"/>
  <text x="736" y="180" font-family="Inter, sans-serif" font-size="11.5" fill="#b0d9ef" text-anchor="middle">K, V: L×d</text>
  <text x="736" y="198" font-family="Inter, sans-serif" font-size="10" fill="#5a8fb0" text-anchor="middle">sharded by context</text>
  <text x="736" y="252" font-family="Inter, sans-serif" font-size="11" fill="#808080" text-anchor="middle">KV never leaves its shard</text>

  <g font-family="Inter, sans-serif" font-size="11.5" fill="#b0b0b0">
    <text x="522" y="312">sufficient statistics now carry the query</text>
    <text x="522" y="332">dimension: (m, l, o) per query row per head</text>
  </g>

  <rect x="516" y="356" width="372" height="80" rx="8" fill="#331414" stroke="#f85149" stroke-width="1.5"/>
  <text x="702" y="384" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="middle">payload scales with T — tile / stream it</text>
  <text x="702" y="406" font-family="Inter, sans-serif" font-size="10.5" fill="#f8a5a5" text-anchor="middle">NOT the tiny one-query payload; budgeted like</text>
  <text x="702" y="424" font-family="Inter, sans-serif" font-size="10.5" fill="#f8a5a5" text-anchor="middle">a GEMM-shaped region, not a decode-shaped one</text>

  <!-- footer band -->
  <rect x="48" y="486" width="864" height="56" rx="8" fill="#0c1d2a" stroke="#07adf8" stroke-width="1.5"/>
  <text x="480" y="510" font-family="Inter, sans-serif" font-size="12" fill="#b0d9ef" text-anchor="middle">Both merges are the same exact online-softmax algebra — distribution changes the payload shape, never the numerical</text>
  <text x="480" y="528" font-family="Inter, sans-serif" font-size="12" fill="#b0d9ef" text-anchor="middle">contract. The decode path is where the 1M-context communication thesis is strongest; prefill must be priced honestly.</text>
</svg>
