name: Nightly Tests

on:
  # Run nightly at 2am UTC
  schedule:
    - cron: '0 2 * * *'

  # Also run on push to main and PRs
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      run_v66_archive:
        description: 'Run archived v6.6 compatibility jobs'
        required: false
        default: false
        type: boolean

# Need write access to push to gh-pages
permissions:
  contents: write
  pages: write

jobs:
  build-and-test:
    name: Required nightly verdict
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h

          # GitHub-hosted runners carry large SDK/tool caches that this C/C++
          # workflow does not use. Free them before model conversion and
          # llama.cpp builds start producing multi-GB temporary artifacts.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          echo "=== Disk after cleanup ==="
          df -h

      - name: Check CPU features
        run: |
          echo "=== CPU Info ==="
          lscpu | grep -E "(Model name|CPU\(s\)|Thread|Core|Socket|Flags)"
          echo "AVX2: $(grep -q avx2 /proc/cpuinfo && echo YES || echo NO)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/requirements-nightly-constraints.txt -r requirements.txt
          pip install -c .github/requirements-nightly-constraints.txt -r version/v7/requirements.txt
          pip install -c .github/requirements-nightly-constraints.txt -r server/requirements.txt
          # v8 inference (ck_run_v8.py) hard-requires its own requirement set —
          # tiktoken in particular — and refuses to auto-bootstrap inside CI.
          pip install -c .github/requirements-nightly-constraints.txt -r version/v8/requirements.txt
          pip install -c .github/requirements-nightly-constraints.txt huggingface_hub torch

      - name: Build CK-Engine
        run: |
          make clean || true
          make -j$(nproc)
          make libck_parity.so
          echo ""
          echo "=== Built libraries ==="
          ls -la build/*.so 2>/dev/null || echo "No .so files"

      - name: Validate parity library ABI
        run: |
          echo "=== Validating libck_parity.so ABI ==="
          test -f build/libck_parity.so
          echo "Checking required exports..."
          nm -D build/libck_parity.so | grep -q ' ck_strict_parity_enabled$'
          nm -D build/libck_parity.so | grep -q ' ck_threadpool_global_destroy$'
          echo "Checking unresolved dynamic symbols..."
          if ldd -r build/libck_parity.so 2>&1 | grep -q "undefined symbol"; then
            echo "::error::Undefined symbols found in build/libck_parity.so"
            ldd -r build/libck_parity.so || true
            exit 1
          fi
          echo "libck_parity.so ABI checks passed"

      - name: Setup llama.cpp for parity testing
        run: |
          LLAMA_CPP_COMMIT="${LLAMA_CPP_COMMIT:-$(git ls-tree HEAD llama.cpp | awk '{print $3}')}"
          if [ -z "$LLAMA_CPP_COMMIT" ]; then
            echo "::error::Could not resolve llama.cpp gitlink from HEAD"
            exit 1
          fi

          rm -rf llama.cpp
          git clone --depth 200 https://github.com/ggerganov/llama.cpp.git llama.cpp

          cd llama.cpp
          git fetch origin "$LLAMA_CPP_COMMIT"
          git checkout --detach "$LLAMA_CPP_COMMIT"
          echo "llama.cpp at: $(git rev-parse --short HEAD)"

          # Apply patches
          if [ -f "../patches/llama.patch" ]; then
            git apply ../patches/llama.patch || echo "llama.patch already applied or not needed"
          fi
          if [ -f "../patches/test-kernel-parity.cpp" ]; then
            mkdir -p tests
            cp ../patches/test-kernel-parity.cpp tests/
          fi
          if [ -f "../patches/ck-engine-parity-bench.patch" ]; then
            git apply ../patches/ck-engine-parity-bench.patch || echo "ck-engine-parity-bench.patch already applied or not needed"
          fi

          # Build a controlled oracle. A native Sapphire Rapids build enables
          # AVX512-FP16 and silently changes ggml_vec_dot_f16 from the FP32
          # accumulation contract used by CKE to FP16 accumulation.
          ggml_isa=(-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_F16C=ON -DGGML_FMA=ON)
          if grep -qw avx512f /proc/cpuinfo; then
            ggml_isa+=(-DGGML_AVX512=ON)
          fi
          cmake -B build \
            -DGGML_CPU=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            "${ggml_isa[@]}"
          cmake --build build -j$(nproc)

          # Build kernel test library
          if [ -f "tests/test-kernel-parity.cpp" ]; then
            export LD_LIBRARY_PATH="$PWD/build/bin:$LD_LIBRARY_PATH"
            g++ -shared -fPIC -o libggml_kernel_test.so \
              tests/test-kernel-parity.cpp \
              -I ggml/include -I ggml/src \
              -L build/bin -lggml -lggml-cpu -lggml-base -lm -lpthread \
              -Wl,-rpath,'$ORIGIN/build/bin' || echo "Kernel test lib failed"
          fi
          cd ..
          echo "V8_QWEN3VL_ENCODER_PARITY_LLAMA_CPP_ROOT=${GITHUB_WORKSPACE}/llama.cpp" >> "${GITHUB_ENV}"
          echo "CK_LLAMA_CPP_ROOT=${GITHUB_WORKSPACE}/llama.cpp" >> "${GITHUB_ENV}"
          echo "CK_REQUIRE_LLAMA_FP32_F16_DOT=1" >> "${GITHUB_ENV}"

      - name: Run Kernel Parity Tests
        run: |
          echo "=== Running Kernel Parity Tests ==="
          export LD_LIBRARY_PATH="$PWD/llama.cpp/build/bin:$LD_LIBRARY_PATH"
          ./scripts/run_parity_smoketest.sh --quick 2>&1 | tee build/parity_test.log

      - name: Check disk after llama.cpp parity setup
        if: always()
        run: |
          # Keep llama.cpp available through the full nightly runner. The
          # report includes litmus and llama.cpp parity rows that compile
          # against ggml headers/libraries after this point.
          echo "=== Disk after llama.cpp parity setup ==="
          df -h

      - name: Determine Fast Regression Scope
        id: regression_scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          before = os.environ.get("GITHUB_EVENT_BEFORE", "")
          head = os.environ.get("GITHUB_SHA", "")
          pr_base = os.environ.get("PR_BASE_SHA", "")
          pr_head = os.environ.get("PR_HEAD_SHA", "")
          zero = "0" * 40

          def changed_files():
              if event in ("schedule", "workflow_dispatch"):
                  return None
              if event == "push":
                  if before and before != zero:
                      try:
                          out = subprocess.check_output(
                              ["git", "diff", "--name-only", before, head, "--"],
                              text=True,
                          )
                          paths = [line.strip() for line in out.splitlines() if line.strip()]
                          if paths:
                              return paths
                      except Exception:
                          pass
                  out = subprocess.check_output(
                      ["git", "diff-tree", "--root", "--no-commit-id", "--name-only", "-r", head, "--"],
                      text=True,
                  )
                  return [line.strip() for line in out.splitlines() if line.strip()]
              if event == "pull_request" and pr_base and pr_head:
                  try:
                      out = subprocess.check_output(
                          ["git", "diff", "--name-only", pr_base, pr_head, "--"],
                          text=True,
                      )
                      return [line.strip() for line in out.splitlines() if line.strip()]
                  except Exception:
                      return []
              return []

          def should_run(paths):
              if paths is None:
                  return True, f"{event} event"
              prefixes = (
                  "scripts/",
                  "src/",
                  "tests/",
                  "version/v7/scripts/",
                  "version/v7/templates/",
                  "version/v7/regression/",
                  "version/v7/test_assets/",
                  "version/v7/src/",
                  "version/v8/scripts/",
                  "version/v8/circuits/",
                  "version/v8/contracts/",
                  "version/v8/schemas/",
                  "version/v8/kernel_maps/",
                  "version/v8/regression/",
                  "version/v8/test_assets/",
                  "version/v8/src/",
              )
              exact = {
                  "Makefile",
                  ".githooks/pre-commit",
                  ".githooks/pre-push",
                  ".github/workflows/nightly.yml",
                  "version/v7/README.md",
                  "version/v8/README.md",
              }
              for path in paths:
                  if path in exact or path.startswith(prefixes):
                      return True, f"changed path: {path}"
              return False, "no runtime/regression path changes"

          paths = changed_files()
          run, reason = should_run(paths)
          out_path = Path(os.environ["GITHUB_OUTPUT"])
          with out_path.open("a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if run else 'false'}\n")
              f.write(f"reason={reason}\n")
          print(f"fast regression should_run={run} ({reason})")
          PY

      - name: Cache v8 regression model artifacts
        # GGUFs are immutable and the manifest pins exact filenames, so a
        # manifest-hash key is correct. Restoring a warm cache avoids the
        # HuggingFace anonymous rate limit (HTTP 429) that otherwise fails
        # every family with a download error.
        if: steps.regression_scope.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/ck-engine-v8/models
          key: v8-regression-models-${{ hashFiles('version/v8/regression/families.json') }}
          restore-keys: |
            v8-regression-models-

      - name: Cache HuggingFace tokenizer oracle downloads
        # The tokenizer parity gates (make test-tokenizer-special) pull the HF
        # oracle tokenizer through HF_HOME; cache it to avoid anonymous 429s.
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: nightly-hf-tokenizers-${{ hashFiles('unittest/test_true_bpe_special_tokens.py') }}
          restore-keys: |
            nightly-hf-tokenizers-

      - name: Run Fast Regression
        id: run_fast_regression
        if: steps.regression_scope.outputs.should_run == 'true'
        continue-on-error: true
        env:
          CK_CACHE_DIR: ${{ github.workspace }}/.cache/ck-engine-v8/models
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          echo "=== Running Fast Regression ==="
          echo "Reason: ${{ steps.regression_scope.outputs.reason }}"
          mkdir -p "${RUNNER_TEMP}/ck-regression-runs" build/regression-reports
          make regression-fast REGRESSION_ARGS="--run-root ${RUNNER_TEMP}/ck-regression-runs --report-root build/regression-reports" 2>&1 | tee build/regression_fast.log

      - name: Prepare scheduled Qwen3-VL encoder parity
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          avail_kb=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)
          free_kb=$(df -Pk "${RUNNER_TEMP}" | awk 'NR==2 {print $4}')
          if [ "${avail_kb:-0}" -lt $((8 * 1024 * 1024)) ] || [ "${free_kb:-0}" -lt $((6 * 1024 * 1024)) ]; then
            echo "Qwen3-VL encoder parity not eligible: needs 8 GiB available RAM and 6 GiB free disk"
            exit 0
          fi

          mmproj=$(python -c 'from huggingface_hub import hf_hub_download; print(hf_hub_download(repo_id="Qwen/Qwen3-VL-8B-Instruct-GGUF", filename="mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf"))')
          echo "V8_QWEN3VL_CACHED_MMPROJ=${mmproj}" >> "${GITHUB_ENV}"
          echo "V8_VISION_ENCODER_ALLOW_NON_AVX512=1" >> "${GITHUB_ENV}"
          echo "CK_LLAMA_CPP_ROOT=${GITHUB_WORKSPACE}/llama.cpp" >> "${GITHUB_ENV}"
          echo "Scheduled Q8_0 encoder parity enabled with ${mmproj}"

          if [ "${avail_kb:-0}" -ge $((16 * 1024 * 1024)) ] && [ "${free_kb:-0}" -ge $((18 * 1024 * 1024)) ]; then
            decoder=$(python -c 'from huggingface_hub import hf_hub_download; print(hf_hub_download(repo_id="Qwen/Qwen3-VL-8B-Instruct-GGUF", filename="Qwen3VL-8B-Instruct-Q4_K_M.gguf"))')
            echo "V8_QWEN3VL_CACHED_MODEL=${decoder}" >> "${GITHUB_ENV}"
            echo "Scheduled Q4_K_M decoder plus Q8_0 encoder smoke enabled"
          else
            echo "Q4_K_M end-to-end smoke not eligible: needs 16 GiB available RAM and 18 GiB free disk"
          fi

      - name: Run Nightly Test Suite
        id: run_nightly
        continue-on-error: true
        env:
          # huggingface_hub/transformers pick up HF_TOKEN automatically; the
          # env var is simply empty when the secret is not configured (forks,
          # local runs), which must not break the workflow.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
        run: |
          set -o pipefail
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "=== Running Full Nightly Test Suite ==="
          echo "Includes: 30+ kernel tests, BF16, quantization, training tests"

          # Create output directory (site/site/ because docs/site/ deploys to root)
          mkdir -p docs/site/site/nightly-results

          # Run tests and write to site/nightly-results/ path on gh-pages
          python scripts/nightly_runner.py --json docs/site/site/nightly-results/latest.json 2>&1 | tee build/nightly_test.log

          # Also save to build for artifact upload
          cp docs/site/site/nightly-results/latest.json build/nightly_report.json 2>/dev/null || true

          # Show summary
          if [ -f docs/site/site/nightly-results/latest.json ]; then
            echo ""
            echo "=== Nightly Test Summary ==="
            python3 -c "import json; d=json.load(open('docs/site/site/nightly-results/latest.json')); s=d['summary']; print(f\"Passed: {s['passed']}\"); print(f\"Failed: {s['failed']}\"); print(f\"Total:  {s['total']}\")"
          fi

      - name: Attach Nightly Summaries
        if: always()
        env:
          REGRESSION_SHOULD_RUN: ${{ steps.regression_scope.outputs.should_run }}
          REGRESSION_REASON: ${{ steps.regression_scope.outputs.reason }}
          REGRESSION_OUTCOME: ${{ steps.run_fast_regression.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          latest_path = Path("docs/site/site/nightly-results/latest.json")
          if not latest_path.exists():
            raise SystemExit("missing nightly latest.json")

          data = json.loads(latest_path.read_text(encoding="utf-8"))
          results = data.get("results") if isinstance(data.get("results"), list) else []
          results_by_name = {
              str(row.get("name")): row
              for row in results
              if isinstance(row, dict) and row.get("name")
          }
          reports_root = Path("build/regression-reports")
          summary_files = sorted(reports_root.glob("*/summary.json"))
          repo_latest_path = Path("docs/site/nightly-results/latest.json")
          requested = str(os.environ.get("REGRESSION_SHOULD_RUN", "")).lower() == "true"
          outcome = str(os.environ.get("REGRESSION_OUTCOME", "skipped")).lower()

          def _utc_mtime(path: Path) -> str:
              return datetime.fromtimestamp(path.stat().st_mtime, timezone.utc).isoformat().replace("+00:00", "Z")

          def _load_previous_payload(key: str):
              if not repo_latest_path.exists():
                  return None
              try:
                  repo_latest = json.loads(repo_latest_path.read_text(encoding="utf-8"))
              except Exception:
                  return None
              prev = repo_latest.get(key)
              return dict(prev) if isinstance(prev, dict) else None

          def _expected_regression_families():
              expected = []
              seen = set()
              manifest_path = Path("version/v8/regression/families.json")
              if manifest_path.exists():
                  try:
                      manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                      for fam in manifest.get("families") or []:
                          if not isinstance(fam, dict):
                              continue
                          fid = str(fam.get("id") or fam.get("family_id") or "").strip()
                          if not fid or fid in seen:
                              continue
                          expected.append({
                              "family_id": fid,
                              "label": fam.get("label") or fid,
                          })
                          seen.add(fid)
                  except Exception as exc:
                      print(f"warning: could not load v8 regression manifest: {exc}")
              if "gemma4" not in seen:
                  expected.append({
                      "family_id": "gemma4",
                      "label": "Gemma4 E4B IT",
                      "failure_detail": "high-memory smoke; skipped unless runner has enough RAM",
                  })
              return expected

          def _normalize_regression_payload(payload):
              expected = _expected_regression_families()
              rows = [dict(row) for row in (payload.get("family_rows") or []) if isinstance(row, dict)]
              by_id = {
                  str(row.get("family_id") or row.get("family") or row.get("label") or ""): row
                  for row in rows
              }
              for fam in expected:
                  fid = fam["family_id"]
                  if fid in by_id:
                      continue
                  row = {
                      "family_id": fid,
                      "label": fam.get("label") or fid,
                      "status": "SKIP",
                      "build_status": "SKIP",
                      "smoke_status": "SKIP",
                      "coherence_status": "SKIP",
                      "contract_status": "SKIP",
                      "first_token_status": "SKIP",
                      "failure_detail": fam.get("failure_detail") or "configured v8 family; no row published in this workflow",
                  }
                  rows.append(row)
                  by_id[fid] = row
              order = {fam["family_id"]: i for i, fam in enumerate(expected)}
              rows.sort(key=lambda row: order.get(str(row.get("family_id") or row.get("family") or ""), len(order)))
              payload["family_rows"] = rows
              payload["families_total"] = len(rows)
              payload["families_passed"] = sum(1 for row in rows if str(row.get("status", "")).upper() == "PASS")
              payload["families_failed"] = sum(1 for row in rows if str(row.get("status", "")).upper() == "FAIL")
              return payload

          regression_payload = {
              "status": "not_run",
              "mode": "fast",
              "families_total": 0,
              "families_passed": 0,
              "families_failed": 0,
              "family_rows": [],
              "note": f"make regression-fast did not run for this workflow event ({os.environ.get('REGRESSION_REASON', 'not requested')}).",
          }

          def _regression_row_status(fam):
              failure_class = str(fam.get("failure_class", "pass"))
              if failure_class == "pass":
                  return "PASS"
              if failure_class == "environment_unavailable":
                  # Download/rate-limit failure: environment issue, not a code
                  # regression. Show SKIP with the cause in failure_detail.
                  return "SKIP"
              return "FAIL"

          if summary_files:
              latest_summary = max(summary_files, key=lambda p: p.stat().st_mtime)
              summary = json.loads(latest_summary.read_text(encoding="utf-8"))
              families = summary.get("families") or []
              family_rows = []
              for fam in families:
                  if not isinstance(fam, dict):
                      continue
                  family_rows.append({
                      "family_id": fam.get("family_id"),
                      "label": fam.get("label"),
                      "status": _regression_row_status(fam),
                      "build_status": fam.get("build_status"),
                      "smoke_status": fam.get("smoke_status"),
                      "coherence_status": fam.get("coherence_status"),
                      "contract_status": fam.get("contract_status"),
                      "first_token_status": fam.get("first_token_status"),
                      "failure_reason": fam.get("failure_reason"),
                      "failure_detail": fam.get("failure_detail"),
                  })
              summary_status = str(summary.get("status", "")).upper()
              regression_payload = {
                  "status": "pass" if summary_status == "PASS" else "skip" if summary_status == "SKIP" else "fail",
                  "mode": summary.get("mode", "fast"),
                  "generated_at": summary.get("generated_at"),
                  "report_dir": summary.get("report_dir"),
                  "summary_path": str(latest_summary),
                  "families_total": len(family_rows),
                  "families_passed": sum(1 for row in family_rows if row.get("status") == "PASS"),
                  "families_failed": sum(1 for row in family_rows if row.get("status") == "FAIL"),
                  "failure_classes": summary.get("failure_classes", {}),
                  "family_rows": family_rows,
                  "note": f"Source: {latest_summary}",
              }
          elif requested:
              regression_payload = {
                  "status": "fail",
                  "mode": "fast",
                  "families_total": 0,
                  "families_passed": 0,
                  "families_failed": 0,
                  "family_rows": [],
                  "note": (
                      f"make regression-fast was requested but did not publish a summary "
                      f"(outcome={outcome}). See build/regression_fast.log."
                  ),
              }
          else:
              prev = _load_previous_payload("regression_fast")
              if prev and (prev.get("family_rows") or prev.get("families_total")):
                  regression_payload = dict(prev)
                  reason = os.environ.get("REGRESSION_REASON", "not requested")
                  regression_payload["note"] = (
                      f"{prev.get('note', 'Preserved previous regression-fast snapshot.')} "
                      f"Preserved because this workflow skipped regression-fast ({reason})."
                  ).strip()
          regression_payload = _normalize_regression_payload(regression_payload)

          kernel_map_report = Path("version/v7/.cache/reports/kernel_map_validation_latest.json")
          kernel_map_result = results_by_name.get("v7 Kernel Map Contracts")
          kernel_map_payload = {
              "status": "not_run",
              "kernel_maps": 0,
              "passed": 0,
              "failed": 0,
              "warnings": 0,
              "sample_warnings": [],
              "note": "v7-kernel-map-contracts did not publish a nightly summary.",
          }
          if kernel_map_report.exists():
              doc = json.loads(kernel_map_report.read_text(encoding="utf-8"))
              summary = doc.get("summary") if isinstance(doc.get("summary"), dict) else {}
              warnings = doc.get("warnings") if isinstance(doc.get("warnings"), list) else []
              kernel_map_payload = {
                  "status": str(summary.get("status", "not_run")).lower(),
                  "generated_at": _utc_mtime(kernel_map_report),
                  "summary_path": str(kernel_map_report),
                  "kernel_maps": int(summary.get("kernel_maps", 0) or 0),
                  "passed": int(summary.get("passed", 0) or 0),
                  "failed": int(summary.get("failed", 0) or 0),
                  "warnings": int(summary.get("warnings", 0) or 0),
                  "strict": bool(summary.get("strict", False)),
                  "sample_warnings": [str(item) for item in warnings[:5]],
                  "note": f"Source: {kernel_map_report}",
              }
          elif isinstance(kernel_map_result, dict):
              result_status = str(kernel_map_result.get("status", "not_run")).lower()
              kernel_map_payload = {
                  "status": "fail" if result_status in ("fail", "timeout") else result_status,
                  "kernel_maps": 0,
                  "passed": 0,
                  "failed": 0,
                  "warnings": 0,
                  "sample_warnings": [],
                  "note": (
                      "v7-kernel-map-contracts ran but did not publish "
                      "kernel_map_validation_latest.json. "
                      + str(kernel_map_result.get("error_msg", "") or "")
                  ).strip(),
              }
          else:
              prev = _load_previous_payload("kernel_map_contracts")
              if prev and (prev.get("kernel_maps") or prev.get("summary_path")):
                  kernel_map_payload = dict(prev)
                  kernel_map_payload["note"] = (
                      f"{prev.get('note', 'Preserved previous kernel-map snapshot.')} "
                      "Preserved because this workflow did not publish a fresh kernel-map summary."
                  ).strip()

          kernel_allocation_report = Path(
              "version/v8/.cache/reports/kernel_allocation_audit_latest.json"
          )
          kernel_allocation_payload = {
              "status": "not_run", "counts": {}, "warnings": [],
              "remaining_providers": [], "allocation_sites": [],
              "note": "v8 kernel allocation audit did not publish a nightly summary.",
          }
          if kernel_allocation_report.exists():
              doc = json.loads(kernel_allocation_report.read_text(encoding="utf-8"))
              counts = doc.get("counts") if isinstance(doc.get("counts"), dict) else {}
              warnings = doc.get("warnings") if isinstance(doc.get("warnings"), list) else []
              providers = doc.get("mapped_allocating_providers")
              providers = providers if isinstance(providers, list) else []
              provider_ids_by_function = {}
              for row in providers:
                  if isinstance(row, dict) and row.get("function"):
                      provider_ids_by_function.setdefault(str(row["function"]), []).append(row.get("id"))
              call_sites = doc.get("call_sites") if isinstance(doc.get("call_sites"), list) else []
              kernel_allocation_payload = {
                  "status": "warn" if warnings else "pass",
                  "generated_at": _utc_mtime(kernel_allocation_report),
                  "summary_path": str(kernel_allocation_report),
                  "counts": counts,
                  "warnings": warnings,
                  "remaining_providers": [
                      {
                          "id": row.get("id"), "function": row.get("function"),
                          "scratch_declared": bool(row.get("scratch_declared", False)),
                          "scratch_bound": bool(row.get("scratch_bound", False)),
                          "selection_status": row.get("selection_status"),
                      }
                      for row in providers if isinstance(row, dict)
                  ],
                  "allocation_sites": [
                      {
                          "path": row.get("path"), "line": row.get("line"),
                          "function": row.get("function"), "allocator": row.get("allocator"),
                          "classification": row.get("classification"),
                          "provider_ids": provider_ids_by_function.get(str(row.get("function")), []),
                      }
                      for row in call_sites
                      if isinstance(row, dict) and row.get("allocator") != "free"
                  ],
                  "note": f"Source: {kernel_allocation_report}",
              }
          else:
              prev = _load_previous_payload("kernel_allocation")
              if prev and (prev.get("counts") or prev.get("summary_path")):
                  kernel_allocation_payload = dict(prev)
                  kernel_allocation_payload["note"] = (
                      f"{prev.get('note', 'Preserved previous allocation-debt snapshot.')} "
                      "Preserved because this workflow did not publish a fresh allocation audit."
                  ).strip()

          def _stage_group_status(row_passed, failed_stage_ids, prefix):
              if row_passed:
                  return "PASS"
              prefix_failures = [stage for stage in failed_stage_ids if str(stage).startswith(prefix)]
              if prefix_failures:
                  return "FAIL"
              return "PASS" if failed_stage_ids else "-"

          backprop_report = Path("version/v7/.cache/reports/backprop_family_matrix/full/v7_backprop_family_matrix_latest.json")
          backprop_result = results_by_name.get("v7 Training Family Regression (full)")
          backprop_payload = {
              "status": "not_run",
              "mode": "full",
              "stage_profile": "default",
              "families_total": 0,
              "families_passed": 0,
              "families_failed": 0,
              "family_rows": [],
              "note": "regression-training-full did not publish a nightly summary.",
          }
          if backprop_report.exists():
              doc = json.loads(backprop_report.read_text(encoding="utf-8"))
              row_payloads = []
              for row in doc.get("results") or []:
                  if not isinstance(row, dict):
                      continue
                  row_summary = row.get("summary") if isinstance(row.get("summary"), dict) else {}
                  failed_stage_ids = [str(stage) for stage in row_summary.get("failed_stage_ids") or []]
                  row_passed = bool(row.get("passed", False))
                  row_payloads.append({
                      "family": row.get("family"),
                      "status": "PASS" if row_passed else "FAIL",
                      "a_status": _stage_group_status(row_passed, failed_stage_ids, "A"),
                      "b_status": _stage_group_status(row_passed, failed_stage_ids, "B"),
                      "c_status": _stage_group_status(row_passed, failed_stage_ids, "C"),
                      "d_status": _stage_group_status(row_passed, failed_stage_ids, "D"),
                      "e_status": _stage_group_status(row_passed, failed_stage_ids, "E"),
                      "f_status": _stage_group_status(row_passed, failed_stage_ids, "F"),
                      "failed_stage_ids": failed_stage_ids,
                      "report_json": row.get("report_json"),
                  })
              summary = doc.get("summary") if isinstance(doc.get("summary"), dict) else {}
              families_passed = int(summary.get("passed_families", 0) or 0)
              families_total = int(summary.get("total_families", len(row_payloads)) or len(row_payloads))
              backprop_payload = {
                  "status": "pass" if bool(summary.get("passed", False)) else "fail",
                  "mode": str(doc.get("mode", "fast") or "fast"),
                  "stage_profile": str(doc.get("stage_profile", "default") or "default"),
                  "generated_at": str(doc.get("generated_at") or _utc_mtime(backprop_report)),
                  "summary_path": str(backprop_report),
                  "families_total": families_total,
                  "families_passed": families_passed,
                  "families_failed": max(0, families_total - families_passed),
                  "family_rows": row_payloads,
                  "failed_families": list(summary.get("failed_families") or []),
                  "note": f"Source: {backprop_report}",
              }
          elif isinstance(backprop_result, dict):
              result_status = str(backprop_result.get("status", "not_run")).lower()
              backprop_payload = {
                  "status": "fail" if result_status in ("fail", "timeout") else result_status,
                  "mode": "fast",
                  "stage_profile": "default",
                  "families_total": 0,
                  "families_passed": 0,
                  "families_failed": 0,
                  "family_rows": [],
                  "note": (
                      "regression-training-full ran but did not publish "
                      "v7_backprop_family_matrix_latest.json. "
                      + str(backprop_result.get("error_msg", "") or "")
                  ).strip(),
              }
          else:
              prev = _load_previous_payload("backprop_regression")
              if prev and (prev.get("family_rows") or prev.get("families_total")):
                  backprop_payload = dict(prev)
                  backprop_payload["note"] = (
                      f"{prev.get('note', 'Preserved previous backprop family snapshot.')} "
                      "Preserved because this workflow did not publish a fresh backprop family summary."
                  ).strip()

          data["regression_fast"] = regression_payload
          data["kernel_map_contracts"] = kernel_map_payload
          data["kernel_allocation"] = kernel_allocation_payload
          data["backprop_regression"] = backprop_payload
          latest_path.write_text(json.dumps(data, indent=2), encoding="utf-8")
          Path("build/nightly_report.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
          print("Attached v8 inference and v7 training summaries to nightly latest.json")
          PY

      - name: Clean regression run artifacts
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/ck-regression-runs"
          rm -rf build/regression-runs
          echo "=== Disk after regression cleanup ==="
          df -h

      - name: Run v6.6 E2E Tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_v66_archive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=== Running v6.6 E2E Tests ==="
          echo "Tests the v6.6 pipeline: download -> convert -> IR -> codegen -> compile -> test"

          # Run v6.6 E2E test
          make e2e-v66 2>&1 | tee build/v66_e2e.log || {
            echo "::warning::v6.6 E2E tests had issues"
            # Don't fail the build yet - v6.6 is still being stabilized
          }

          echo ""
          echo "=== v6.6 E2E Test Complete ==="

      - name: Run v6.6 Strict Parity Matrix (runtime-required)
        if: github.event_name == 'workflow_dispatch' && inputs.run_v66_archive
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=== Running v6.6 Strict Parity Matrix ==="
          echo "Enforces runtime-required parity checks (no SKIP pass-through)."
          make v6.6-validate-parity-matrix-required 2>&1 | tee build/v66_parity_required.log || {
            echo "::warning::v6.6 strict parity matrix had issues"
            echo "::warning::See build/v66_parity_required.log artifact for details"
          }
          echo ""
          echo "=== v6.6 Strict Parity Matrix Complete ==="

      - name: Final disk cleanup before artifact upload
        if: always()
        run: |
          rm -rf llama.cpp
          rm -rf "${RUNNER_TEMP}/ck-engine-v8"
          rm -rf "${RUNNER_TEMP}/ck-engine"
          rm -rf "${HOME}/.cache/ck-engine"
          rm -rf "${HOME}/.cache/ck-engine-v6.6"
          rm -rf "${HOME}/.cache/ck-engine-v7"
          rm -rf "${HOME}/.cache/ck-engine-v8"
          echo "=== Disk before artifact upload ==="
          df -h

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/*.log
            build/*.json
            build/regression-reports/**
            version/v7/.cache/reports/kernel_map_validation_latest.json
            version/v7/.cache/reports/backprop_family_matrix/**
            version/v8/.cache/reports/**
          retention-days: 7

      - name: Prepare nightly results for deployment
        id: nightlyprep
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          DEPLOY_READY=false
          if [ -f docs/site/site/nightly-results/latest.json ]; then
            # Create dated report
            DATE=$(date +%Y-%m-%d)
            cp docs/site/site/nightly-results/latest.json "docs/site/site/nightly-results/report-${DATE}.json"

            # Fetch existing historical reports from gh-pages to preserve history
            echo "Fetching historical reports from gh-pages..."
            PAGES_URL="https://raw.githubusercontent.com/${{ github.repository }}/gh-pages"

            # Fetch existing index to get list of historical reports
            if curl -sf "${PAGES_URL}/site/nightly-results/index.json" -o /tmp/existing_index.json; then
              echo "Found existing index with historical data"

              # Download each historical report file that we don't already have
              for report_file in $(jq -r '.reports[].file' /tmp/existing_index.json 2>/dev/null); do
                if [ ! -f "docs/site/site/nightly-results/${report_file}" ]; then
                  echo "  Fetching ${report_file}..."
                  curl -sf "${PAGES_URL}/site/nightly-results/${report_file}" \
                    -o "docs/site/site/nightly-results/${report_file}" || true
                fi
              done
            else
              echo "No existing index found (first run or new repo)"
            fi

            # Update index.json with all report summaries (now includes historical)
            python3 scripts/nightly_runner.py --update-index --results-dir docs/site/site/nightly-results

            echo "=== Nightly results prepared ==="
            echo "Reports in directory:"
            ls -la docs/site/site/nightly-results/
            echo ""
            echo "Index contains $(jq '.reports | length' docs/site/site/nightly-results/index.json) reports"

            # Stage ONLY the nightly results for deployment. Publishing the
            # whole docs/site tree from this hours-old checkout races with
            # docs.yml deploys of newer merges and reverts freshly merged
            # documentation pages (keep_files then preserves the stale copy).
            # Scoped publishing keeps concurrent nightlies harmless: they can
            # only add or update files under site/nightly-results/.
            rm -rf build/nightly-pages
            mkdir -p build/nightly-pages/site
            cp -r docs/site/site/nightly-results build/nightly-pages/site/
            echo "Staged $(find build/nightly-pages -type f | wc -l) files for deploy"
            DEPLOY_READY=true
          fi
          echo "deploy_ready=${DEPLOY_READY}" >> "$GITHUB_OUTPUT"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.nightlyprep.outputs.deploy_ready == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/nightly-pages
          keep_files: true

      - name: Enforce nightly required verdict
        if: always()
        env:
          REGRESSION_SHOULD_RUN: ${{ steps.regression_scope.outputs.should_run }}
          REGRESSION_OUTCOME: ${{ steps.run_fast_regression.outcome }}
          NIGHTLY_OUTCOME: ${{ steps.run_nightly.outcome }}
          NIGHTLY_STARTED_AT: ${{ steps.run_nightly.outputs.started_at }}
        run: |
          python3 scripts/verify_nightly_results.py \
            --report docs/site/site/nightly-results/latest.json \
            --not-before-epoch "${NIGHTLY_STARTED_AT:-0}" \
            --runner-outcome "${NIGHTLY_OUTCOME:-failure}" \
            --fast-regression-required "${REGRESSION_SHOULD_RUN:-false}" \
            --fast-regression-outcome "${REGRESSION_OUTCOME:-skipped}"

  whisper-long-audio:
    name: Whisper ${{ matrix.model }} five-minute E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: tiny
            timeout: 90
          - model: base
            timeout: 120
          - model: small
            timeout: 180
          - model: medium
            timeout: 300
          - model: large-v3
            timeout: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/requirements-nightly-constraints.txt -r requirements.txt
          pip install -c .github/requirements-nightly-constraints.txt -r version/v8/requirements.txt
          command -v ffmpeg >/dev/null || sudo apt-get update
          command -v ffmpeg >/dev/null || sudo apt-get install -y ffmpeg

      - name: Cache model and generated runtime
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/whisper-long-audio
          key: whisper-long-audio-${{ matrix.model }}-${{ hashFiles('version/v8/scripts/**', 'version/v8/circuits/audio_*', 'version/v8/kernel_maps/**', 'version/v8/test_assets/whisper_long_audio/corpus.json') }}

      - name: Run non-skippable five-minute certification
        env:
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CK_CACHE_DIR: ${{ github.workspace }}/.cache/whisper-long-audio/model-cache
          CK_V8_PYTHON: python
          CK_NUM_THREADS: 4
        run: |
          make test-whisper-long-audio-nightly \
            PYTHON=python \
            V8_WHISPER_LONG_AUDIO_MODEL=${{ matrix.model }} \
            V8_WHISPER_LONG_AUDIO_WORK_ROOT=${{ github.workspace }}/.cache/whisper-long-audio/work \
            V8_WHISPER_LONG_AUDIO_REPORT_ROOT=build/whisper-long-audio

      - name: Upload Whisper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ matrix.model }}-five-minute-evidence
          path: build/whisper-long-audio/*.json
          if-no-files-found: error
          retention-days: 14
